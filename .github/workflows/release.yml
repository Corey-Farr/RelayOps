name: Tagged container release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.13'}
      - name: Validate tag matches application versions
        run: |
          python - <<'PY'
          import json, os, tomllib
          version = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          assert tomllib.load(open('backend/pyproject.toml', 'rb'))['project']['version'] == version
          assert json.load(open('frontend/package.json'))['version'] == version
          PY
  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [backend, frontend, demo-sink]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize image owner
        id: repository
        shell: bash
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/${{ steps.repository.outputs.name }}-${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long
          flavor: latest=false
      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: true
          sbom: true
